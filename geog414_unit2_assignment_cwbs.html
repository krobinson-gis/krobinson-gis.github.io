<script type="text/javascript">

// TO DO: Write utility function to return fill color for symbols
function symbolColor(result) {
	if (result == 'Confederate') return "#f16913";
	else if (result == 'Union') return "#2171b5";
	else return "#000000";
}
// TO DO: Write utility function to return radius (in pixels) for symbols
function symbolRadius(casualties) {
	if (casualties <= 2500) return 5;
	if (casualties <= 5000) return 10;
	if (casualties <= 7500) return 15;
	if (casualties <= 10000) return 20;
	if (casualties <= 20000) return 30;
	if (casualties <= 30000) return 40;
	if (casualties <= 40000) return 50;
	if (casualties <= 51000) return 60;
	else return 5;
}
// TO DO: Initialize the map with an appropriate center and zoom level
let map = L.map("map").setView([36.7, -93.8], 4);

// TO DO: Add a visually appealing and unobtrusive basemap
let basemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	subdomains: 'abcd',
	maxZoom: 20
}).addTo(map);

// TO DO: Add GeoJSON data layer, using pointToLayer to create each feature as a circleMarker with a specified radius, fill color, and stroke color.  Bind a tooltip showing variable values to each feature as well, within the pointToLayer function.
let dataLayer = L.geoJson(battleSites, {
	pointToLayer: function(feature, latlng) {
		return L.circleMarker(latlng, {
			radius: symbolRadius(feature.properties.casualties),
			fillColor: symbolColor(feature.properties.result),
			color: symbolColor(feature.properties.result),
			weight: 1
		}).bindTooltip(`Battle Name: <i>${feature.properties.battle_name}</i><br/>Location: ${feature.properties.locations}<br/>Dates: ${feature.properties.begin_date} to ${feature.properties.end_date}<br/>Winning Side: ${feature.properties.result}<br/><strong>Total Casualties: ${feature.properties.casualties}</strong><br/>${feature.properties.casualties_text}`);
	}
}).addTo(map);
// TO DO: Create new Leaflet control and using the onAdd function, take the contents of the legend in the DOM and assign it to the new Leaflet control
let legend = L.control({position: 'bottomleft'});
legend.onAdd = function(map) {
	return document.getElementById('legend');
}
legend.addTo(map);

</script>
